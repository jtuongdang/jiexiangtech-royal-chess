services:
  mongo:
    image: mongo:8.0
    volumes:
      - royal-online-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 12
  chess-server:
    build: .
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ROYAL_LOCAL_PORT:-8080}:8080"
    environment:
      PORT: 8080
      MONGODB_URI: mongodb://mongo:27017/royal_local
      CHESS_BETA_KEY: ${CHESS_BETA_KEY:?Set a local organizer key with at least 24 characters}

volumes:
  royal-online-data:
