name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Verify · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Compile, test and verify
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Smoke test the bundled JAR
        shell: bash
        run: |
          export CHESSMASTER_DATA_DIR="$(mktemp -d)"
          java -Djava.awt.headless=true -jar chess-desktop/target/royal-chess-*-all.jar --smoke
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
      - name: Upload verified portable JAR
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: application-portable
          path: chess-desktop/target/royal-chess-*-all.jar
          if-no-files-found: error
