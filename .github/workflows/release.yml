name: Release

on:
  workflow_dispatch:
    inputs:
      staged-macos:
        description: Verify Apple Silicon packages staged in an unpublished release after native smoke tests
        type: boolean
        default: false

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      staged-macos: ${{ inputs.staged-macos }}

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.staged-macos && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","macos-26","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/download-artifact@v4
        with:
          name: application-portable
          path: chess-desktop/target
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos.sh dist/app app-image
          CHESSMASTER_DATA_DIR="$(mktemp -d)" 'dist/app/ChessMaster Royal.app/Contents/MacOS/ChessMaster Royal' --smoke
          mkdir -p dist/upload
          ditto -c -k --keepParent 'dist/app/ChessMaster Royal.app' "dist/upload/royal-chess-macos-$(uname -m).zip"
          scripts/package-macos.sh dist/installer dmg
          mv dist/installer/*.dmg "dist/upload/royal-chess-macos-$(uname -m).dmg"
          hdiutil verify "dist/upload/royal-chess-macos-$(uname -m).dmg"
          mount_dir=$(mktemp -d)
          printf 'Y\n' | hdiutil attach -readonly -nobrowse -mountpoint "$mount_dir" \
            "dist/upload/royal-chess-macos-$(uname -m).dmg"
          trap 'hdiutil detach "$mount_dir"' EXIT
          CHESSMASTER_DATA_DIR="$(mktemp -d)" "$mount_dir/ChessMaster Royal.app/Contents/MacOS/ChessMaster Royal" --smoke
      - name: Package for Linux
        if: runner.os == 'Linux'
        run: |
          scripts/package-linux.sh dist/app app-image
          CHESSMASTER_DATA_DIR="$(mktemp -d)" dist/app/ChessMasterRoyal/bin/ChessMasterRoyal --smoke
          mkdir -p dist/upload
          tar -C dist/app -czf "dist/upload/royal-chess-linux-$(uname -m).tar.gz" ChessMasterRoyal
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/package-desktop.ps1 -Destination dist/app
          $env:CHESSMASTER_DATA_DIR = Join-Path $env:RUNNER_TEMP "royal-windows-smoke"
          $process = Start-Process -FilePath "dist/app/ChessMasterRoyal/ChessMasterRoyal.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$env:CHESSMASTER_DATA_DIR/chessmaster.db")) {
            throw "Native launcher smoke test failed"
          }
          New-Item -ItemType Directory -Path dist/upload
          Compress-Archive -Path dist/app/ChessMasterRoyal -DestinationPath dist/upload/royal-chess-windows-x64.zip
      - name: Upload verified native application
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ runner.os }}
          path: dist/upload/*
          if-no-files-found: error

  verify-staged-macos:
    if: inputs.staged-macos
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: application-portable
          path: portable
      - name: Verify both Apple Silicon packages against the tested JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 scripts/verify-macos-release.py --version)
          gh release view "v$version" --json isDraft,targetCommitish |
            jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' >/dev/null
          gh release download "v$version" --dir staged --pattern 'royal-chess-macos-arm64.*'
          if ! command -v 7z >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y 7zip
          fi
          python3 scripts/verify-macos-release.py "$version" "portable/royal-chess-$version-all.jar" staged
      - uses: actions/upload-artifact@v4
        with:
          name: application-macOS
          path: staged/royal-chess-macos-arm64.*
          if-no-files-found: error

  publish:
    needs: [package, verify-staged-macos]
    if: >-
      ${{ !cancelled() && needs.package.result == 'success' &&
      (inputs.staged-macos && needs.verify-staged-macos.result == 'success' ||
      !inputs.staged-macos && needs.verify-staged-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: application-*
          path: verified
          merge-multiple: true
      - name: Create a release from verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          STAGED_MACOS: ${{ inputs.staged-macos }}
        run: |
          version=$(python3 scripts/verify-macos-release.py --version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          if [[ -n "$(git ls-remote origin "refs/tags/$tag")" ]]; then
            echo "Release tag $tag already exists." >&2
            exit 1
          fi
          packages=(
            "verified/royal-chess-$version-all.jar"
            verified/royal-chess-macos-arm64.dmg
            verified/royal-chess-macos-arm64.zip
            verified/royal-chess-windows-x64.zip
            verified/royal-chess-linux-x86_64.tar.gz
          )
          sha256sum "${packages[@]}" | sed 's#  .*/#  #' > SHA256SUMS.txt
          if [[ "$STAGED_MACOS" == true ]]; then
            gh release view "$tag" --json isDraft,targetCommitish |
              jq -e --arg sha "$GITHUB_SHA" '.isDraft and .targetCommitish == $sha' >/dev/null
            gh release download "$tag" --dir recheck --pattern 'royal-chess-macos-arm64.*'
            cmp "${packages[1]}" recheck/royal-chess-macos-arm64.dmg
            cmp "${packages[2]}" recheck/royal-chess-macos-arm64.zip
            gh release upload "$tag" --clobber "${packages[0]}" "${packages[3]}" "${packages[4]}" \
              SHA256SUMS.txt LICENSE THIRD_PARTY.md
            gh release edit "$tag" --draft=false --latest --target "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "ChessMaster – Royal Edition $tag" \
              --generate-notes "${packages[@]}" SHA256SUMS.txt LICENSE THIRD_PARTY.md
          fi
