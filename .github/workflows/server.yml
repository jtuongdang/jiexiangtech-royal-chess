name: Publish online server

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the published image to the Render beta service
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: online-server-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      ROYAL_TEST_MONGO_URI: mongodb://127.0.0.1:27017/royal_ci
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
      - name: Verify rules and online server
        run: mvn --batch-mode --no-transfer-progress -pl chess-server -am clean verify
      - name: Validate the Docker Hub repository
        run: |
          if [[ ! "$SERVER_IMAGE" =~ ^[a-z0-9][a-z0-9_-]*/[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "Set the DOCKERHUB_IMAGE variable to your private namespace/repository." >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push a versioned image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.SERVER_IMAGE }}:sha-${{ github.sha }}
          build-args: ROYAL_BUILD_REV=${{ github.sha }}
      - name: Deploy and verify the Render revision
        if: inputs.deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          if [[ "$DEPLOY_HOOK" != https://api.render.com/deploy/*\?key=* ||
                ! "$SERVICE_URL" =~ ^https://[a-z0-9-]+\.onrender\.com/?$ ||
                ! "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Set the Render deploy hook and onrender.com URL before deploying." >&2
            exit 1
          fi
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --max-time 30 --get --data-urlencode "imgURL=docker.io/$SERVER_IMAGE@$DIGEST" "$DEPLOY_HOOK")
          if [[ "$code" != 200 && "$code" != 202 ]]; then
            echo "Render rejected the deployment (HTTP $code)." >&2
            exit 1
          fi
          for attempt in {1..48}; do
            if curl --silent --fail --max-time 8 "${SERVICE_URL%/}/health" |
               jq -e --arg sha "$GITHUB_SHA" '.status == "ok" and .revision == $sha' >/dev/null; then
              echo "Render is serving revision $GITHUB_SHA."
              exit 0
            fi
            sleep 10
          done
          echo "The expected Render revision did not become healthy." >&2
          exit 1
